name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      - name: Run test_verify
        run: bash tests/test_verify.sh

      - name: Run test_render
        run: bash tests/test_render.sh

      - name: Run test_mathjax
        run: node tests/test_mathjax.cjs

      # id:0720 -- pin/hash drift guard for docs/dreamed/lean/*.lean. Runs the script
      # DIRECTLY, not via tests/run.sh: run.sh would drag test_lean.sh's real `lake
      # build` and a cold Mathlib into every push, which is the cost id:9d8c is parked
      # on. This guard needs no lake, no Ruby and no Node, and takes about a second.
      - name: Run dreamed_lean_pin drift guard
        run: bash verify/dreamed_lean_pin.sh
