<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 470" style="min-width:740px" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The knower A sits inside the whole it describes, so its knowledge map takes a state of A to a description whose domain includes A; a table marks Cantor-Lawvere as applying, Tarski as nearly, Wolpert-Breuer as conditional, and Goedel I as not applying</title>
<rect x="0" y="0" width="900" height="470" fill="#fcfcfa"/>
<g font-family="system-ui, sans-serif" fill="#1f2430">

  <rect x="30" y="40" width="330" height="200" rx="10" fill="#eef1f7" stroke="#3b3f9e" stroke-width="2.5"/>
  <text x="46" y="66" font-size="15" font-weight="700" fill="#3b3f9e">the whole (the owner's |42&gt;)</text>
  <rect x="60" y="90" width="150" height="110" rx="8" fill="#ffffff" stroke="#17696b" stroke-width="2.5"/>
  <text x="135" y="130" font-size="17" font-weight="700" fill="#12484a" text-anchor="middle">A</text>
  <text x="135" y="152" font-size="13" fill="#6b7280" text-anchor="middle">the knower,</text>
  <text x="135" y="170" font-size="13" fill="#6b7280" text-anchor="middle">one of the factors</text>
  <text x="290" y="150" font-size="14" fill="#6b7280" text-anchor="middle">rest</text>

  <path d="M362,140 L470,140" stroke="#1f2430" stroke-width="2.5" marker-end="url(#arw1)"/>
  <defs><marker id="arw1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs>

  <rect x="478" y="95" width="392" height="92" rx="10" fill="#ffffff" stroke="#1f2430" stroke-width="2.5"/>
  <text x="674" y="130" font-size="20" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">A -&gt; (A -&gt; B)</text>
  <text x="674" y="156" font-size="14" fill="#6b7280" text-anchor="middle">each state of A holds a description, and A is in its domain</text>
  <text x="674" y="174" font-size="14" fill="#6b7280" text-anchor="middle">"you already know everything including this very text"</text>

  <text x="674" y="216" font-size="15" fill="#a01b1b" text-anchor="middle" font-weight="700">no such map is point-surjective, for any A whatsoever</text>
  <text x="674" y="236" font-size="13" fill="#6b7280" text-anchor="middle">ask it what it says about itself, then flip the answer</text>

  <g font-size="15">
    <text x="30" y="285" font-weight="700">Which impossibility theorem actually applies</text>
    <line x1="30" y1="296" x2="870" y2="296" stroke="#c9ccd4" stroke-width="1.5"/>

    <g fill="#12484a">
      <circle cx="42" cy="322" r="8" fill="#17696b"/>
      <text x="62" y="328" font-weight="700">Cantor / Lawvere</text>
      <text x="260" y="328" fill="#3f4653">needs nothing but sets and functions</text>
      <text x="660" y="328" font-weight="700">APPLIES, directly</text>
    </g>
    <g>
      <path d="M34,346 l8,-9 l8,9 z" fill="#c05621"/>
      <text x="62" y="356" font-weight="700" fill="#8a3c14">Tarski undefinability</text>
      <text x="260" y="356" fill="#3f4653">needs a formal language with arithmetic</text>
      <text x="660" y="356" font-weight="700" fill="#8a3c14">NEARLY: no language given</text>
    </g>
    <g>
      <path d="M34,374 l8,-9 l8,9 z" fill="none" stroke="#c05621" stroke-width="2"/>
      <text x="62" y="384" font-weight="700" fill="#8a3c14">Wolpert / Breuer</text>
      <text x="260" y="384" fill="#3f4653">needs physics (inference devices)</text>
      <text x="660" y="384" font-weight="700" fill="#8a3c14">CONDITIONALLY</text>
    </g>
    <g>
      <line x1="34" y1="404" x2="50" y2="420" stroke="#a01b1b" stroke-width="3"/>
      <line x1="50" y1="404" x2="34" y2="420" stroke="#a01b1b" stroke-width="3"/>
      <text x="62" y="418" font-weight="700" fill="#a01b1b">Goedel I</text>
      <text x="260" y="418" fill="#3f4653">needs a consistent, effectively axiomatized theory</text>
      <text x="660" y="418" font-weight="700" fill="#a01b1b">DOES NOT APPLY</text>
    </g>
    <text x="62" y="444" font-size="13" fill="#6b7280">contra corpus row M-5, which welds all four into one line</text>
  </g>
</g>
</svg>
