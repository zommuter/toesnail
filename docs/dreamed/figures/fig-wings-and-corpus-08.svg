<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>In the edot incident a staleness DAG would have caught all four downstream discrepancies and neither of the two claims that were wrong on arrival, because a checker reading only the dependency graph and the edit set is blind to correctness</title>
<g font-family="system-ui, sans-serif" fill="#1f2430">
  <rect x="20" y="20" width="420" height="200" fill="#e2ecdf" stroke="#3d6b45" stroke-width="2"/>
  <text x="230" y="46" font-size="18" font-weight="700" text-anchor="middle">PROPAGATION: the DAG catches it</text>
  <circle cx="80" cy="92" r="20" fill="#3d6b45"/>
  <text x="80" y="98" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
  <text x="80" y="130" font-size="15" text-anchor="middle">edited</text>
  <g stroke="#3d6b45" stroke-width="2">
    <line x1="100" y1="92" x2="180" y2="62"/>
    <line x1="100" y1="92" x2="180" y2="92"/>
    <line x1="100" y1="92" x2="180" y2="122"/>
    <line x1="200" y1="62" x2="280" y2="152"/>
  </g>
  <circle cx="190" cy="62" r="14" fill="#ffffff" stroke="#3d6b45" stroke-width="2"/>
  <circle cx="190" cy="92" r="14" fill="#ffffff" stroke="#3d6b45" stroke-width="2"/>
  <circle cx="190" cy="122" r="14" fill="#ffffff" stroke="#3d6b45" stroke-width="2"/>
  <circle cx="290" cy="152" r="14" fill="#ffffff" stroke="#3d6b45" stroke-width="2"/>
  <text x="230" y="196" font-size="16" text-anchor="middle">whatever depends, through any chain,</text>
  <text x="230" y="214" font-size="16" text-anchor="middle">on a stale claim is stale</text>

  <rect x="460" y="20" width="420" height="200" fill="#f6e2d8" stroke="#b04a25" stroke-width="2"/>
  <text x="670" y="46" font-size="18" font-weight="700" text-anchor="middle">ORIGINATION: it cannot</text>
  <circle cx="520" cy="92" r="20" fill="#b04a25"/>
  <text x="520" y="98" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>
  <text x="520" y="130" font-size="15" text-anchor="middle">wrong when written</text>
  <g stroke="#b04a25" stroke-width="2" stroke-dasharray="5 4">
    <line x1="540" y1="92" x2="620" y2="92"/>
  </g>
  <circle cx="630" cy="92" r="14" fill="#ffffff" stroke="#b04a25" stroke-width="2"/>
  <text x="670" y="162" font-size="16" text-anchor="middle">nothing upstream changed, so the</text>
  <text x="670" y="182" font-size="16" text-anchor="middle">edit set is empty and the verdict is</text>
  <text x="670" y="204" font-size="17" font-weight="700" text-anchor="middle">"nothing stale"</text>

  <rect x="20" y="238" width="860" height="86" fill="#ffffff" stroke="#2b5d8a" stroke-width="2"/>
  <text x="36" y="262" font-size="17" font-weight="700">The edot incident, scored exactly.</text>
  <text x="36" y="284" font-size="16">CAUGHT by the DAG: all FOUR downstream discrepancies the sign fix propagated. NOT CAUGHT: the sign error itself, and a</text>
  <text x="36" y="304" font-size="16">2021 averaging-window error. Both were wrong from the moment they were written. What found the sign error was an</text>
  <text x="36" y="320" font-size="16">INSTRUMENT running a SymPy check of a claim against its derivation, one claim at a time, where someone chose to instrument.</text>
</g>
</svg>
