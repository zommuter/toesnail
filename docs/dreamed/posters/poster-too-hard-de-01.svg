<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1280" role="img" aria-labelledby="dp1-title">
<title id="dp1-title">Poster: zwei harmlose Zutaten, eine gefährliche Mischung. Plusrechnen allein ist sicher, Malrechnen allein ist sicher, und beides zusammen erzeugt Fragen, die nie beantwortet werden können. Ein Haken-Feld ergänzt, dass Plusrechnen plus die einzige Frage, ob eine Zahl eine Quadratzahl ist, das Ganze schon kippt.</title>
<defs>
<marker id="dp1arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
</marker>
<pattern id="dp1hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="12" height="12" fill="#f6ebe4"/>
<line x1="0" y1="0" x2="0" y2="12" stroke="#c98d6a" stroke-width="4"/>
</pattern>
</defs>

<rect x="0" y="0" width="760" height="1280" fill="#fbfaf8"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#1a1a1a">

<rect x="0" y="0" width="760" height="190" fill="#efeae2"/>
<text x="380" y="74" font-size="44" text-anchor="middle" font-weight="bold">ZWEI HARMLOSE ZUTATEN.</text>
<text x="380" y="128" font-size="44" text-anchor="middle" font-weight="bold">EINE GEFÄHRLICHE MISCHUNG.</text>
<text x="380" y="168" font-size="25" text-anchor="middle" fill="#4a4a4a">Wo der Mathematik die Antworten ausgehen.</text>

<text x="220" y="234" font-size="28" text-anchor="middle" font-weight="bold">PLUSRECHNEN</text>
<rect x="145" y="250" width="150" height="150" rx="12" fill="#ffffff" stroke="#2f6b3f" stroke-width="4"/>
<rect x="153" y="330" width="134" height="62" fill="#e2efe5"/>
<text x="220" y="352" font-size="76" text-anchor="middle" font-weight="bold">+</text>
<text x="220" y="440" font-size="27" text-anchor="middle" font-weight="bold" fill="#2f6b3f">SICHER</text>
<text x="220" y="472" font-size="24" text-anchor="middle">Beantwortet jede Frage</text>
<text x="220" y="500" font-size="24" text-anchor="middle">über das Plusrechnen.</text>

<text x="540" y="234" font-size="28" text-anchor="middle" font-weight="bold">MALRECHNEN</text>
<rect x="465" y="250" width="150" height="150" rx="12" fill="#ffffff" stroke="#2f6b3f" stroke-width="4"/>
<rect x="473" y="330" width="134" height="62" fill="#e2efe5"/>
<text x="540" y="352" font-size="76" text-anchor="middle" font-weight="bold">&#215;</text>
<text x="540" y="440" font-size="27" text-anchor="middle" font-weight="bold" fill="#2f6b3f">SICHER</text>
<text x="540" y="472" font-size="24" text-anchor="middle">Beantwortet jede Frage</text>
<text x="540" y="500" font-size="24" text-anchor="middle">über das Malrechnen.</text>

<line x1="220" y1="520" x2="328" y2="576" stroke="#3a3a3a" stroke-width="3" marker-end="url(#dp1arrow)"/>
<line x1="540" y1="520" x2="432" y2="576" stroke="#3a3a3a" stroke-width="3" marker-end="url(#dp1arrow)"/>

<rect x="215" y="586" width="330" height="210" rx="16" fill="url(#dp1hatch)" stroke="#8a3d12" stroke-width="5"/>
<text x="380" y="634" font-size="30" text-anchor="middle" font-weight="bold">BEIDES ZUSAMMEN</text>
<text x="380" y="710" font-size="52" text-anchor="middle" font-weight="bold">+  und  &#215;</text>
<text x="380" y="768" font-size="28" text-anchor="middle" font-weight="bold" fill="#8a3d12">NICHT SICHER</text>

<text x="380" y="842" font-size="30" text-anchor="middle" font-weight="bold">Jetzt gibt es Fragen, die sie</text>
<text x="380" y="878" font-size="30" text-anchor="middle" font-weight="bold">NIEMALS beantworten kann.</text>
<text x="380" y="918" font-size="24" text-anchor="middle">Nicht: „hat bloss noch keiner geschafft“.</text>
<text x="380" y="948" font-size="24" text-anchor="middle">Schon in den 1930ern als unmöglich bewiesen.</text>

<rect x="70" y="980" width="620" height="232" rx="10" fill="#ffffff" stroke="#2d5c8a" stroke-width="3"/>
<text x="94" y="1024" font-size="30" font-weight="bold" fill="#2d5c8a">DER HAKEN</text>
<text x="94" y="1062" font-size="24">Du brauchst das Malrechnen gar nicht.</text>
<text x="94" y="1092" font-size="24">Plusrechnen und eine einzige Zusatzfrage,</text>
<text x="94" y="1122" font-size="24">„ist diese Zahl eine Quadratzahl?“, holen</text>
<text x="94" y="1152" font-size="24">das Malrechnen schon zurück. Eine harmlose</text>
<text x="94" y="1182" font-size="24">kleine Frage kippt das Ganze über die Kante.</text>

<text x="380" y="1240" font-size="19" text-anchor="middle" fill="#5c5c5c">Weggelassen: die echten Namen (Presburger, Skolem, Gödel, Church)</text>
<text x="380" y="1264" font-size="19" text-anchor="middle" fill="#5c5c5c">und was genau als Frage zählt, die eine Maschine stellen darf.</text>
</g>
</svg>
