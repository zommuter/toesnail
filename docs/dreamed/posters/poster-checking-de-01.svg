<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 1110" style="width:100%;max-width:620px;height:auto;display:block;margin:0 auto" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Poster: zu wissen, welche Aufgaben unmöglich sind, hilft nur, wenn das Nachprüfen billig ist</title>
<desc>Zwei Linien kreuzen sich in einem Diagramm. Die eine, durchgezogen, ist der Wert eines Tipps über Unmöglichkeit, und sie fällt, je mehr Zeit du hast. Die andere, gestrichelt, ist der Preis, den du dir für diesen Tipp leisten könntest, und sie steigt mit der Zeit. Der Keil über dem Kreuzungspunkt, wo beides hoch wäre, bleibt leer. Darunter zeigt ein kleines Rennen, dass wer einfach alle Aufgaben probiert zwanzig schafft, und wer erst nachprüft nur siebzehn Komma sechs.</desc>
<rect x="0" y="0" width="700" height="1110" fill="#fdfcf9"/>
<rect x="0" y="0" width="700" height="10" fill="#17696b"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">

<text x="40" y="90" font-size="44" font-weight="700" fill="#10233a">Zu wissen, welche Aufgaben</text>
<text x="40" y="140" font-size="44" font-weight="700" fill="#10233a">unmöglich sind, hilft nur,</text>
<text x="40" y="190" font-size="44" font-weight="700" fill="#10233a">wenn das Prüfen billig ist</text>

<text x="40" y="234" font-size="26" fill="#46535f">Du hast Hausaufgaben und wenig Zeit.</text>
<text x="40" y="266" font-size="26" fill="#46535f">Ein paar der Aufgaben sind unmöglich.</text>

<line x1="70" y1="600" x2="630" y2="600" stroke="#b9b5ab" stroke-width="2"/>
<line x1="70" y1="320" x2="70" y2="600" stroke="#b9b5ab" stroke-width="2"/>

<polyline points="95,360 605,585" fill="none" stroke="#17696b" stroke-width="5"/>
<polyline points="95,585 605,360" fill="none" stroke="#b0521a" stroke-width="5" stroke-dasharray="12 8"/>

<text x="95" y="345" font-size="24" font-weight="600" fill="#17696b">Wert des Tipps</text>
<text x="605" y="345" font-size="24" font-weight="600" fill="#b0521a" text-anchor="end">was du zahlen kannst</text>

<circle cx="350" cy="472" r="9" fill="#10233a"/>
<text x="350" y="404" font-size="25" fill="#10233a" text-anchor="middle">Hier oben wärst du</text>
<text x="350" y="434" font-size="25" fill="#10233a" text-anchor="middle">gern. Ist aber niemand.</text>

<text x="70" y="632" font-size="24" fill="#6b6a63">kaum Zeit</text>
<text x="630" y="632" font-size="24" fill="#6b6a63" text-anchor="end">jede Menge Zeit</text>
<text x="350" y="664" font-size="24" fill="#46535f" text-anchor="middle">wie viel Zeit du hast</text>

<text x="40" y="714" font-size="26" font-weight="600" fill="#10233a">Echt gelaufen. KEINE unmögliche Aufgabe dabei:</text>
<text x="40" y="762" font-size="24" fill="#46535f">arbeitet sie einfach ab</text>
<rect x="340" y="740" width="220" height="32" rx="6" fill="#17696b"/>
<text x="550" y="763" font-size="24" font-weight="700" fill="#ffffff" text-anchor="end">20,0</text>
<text x="40" y="808" font-size="24" fill="#46535f">prüft erst nach</text>
<rect x="340" y="786" width="193" height="32" rx="6" fill="#b0521a"/>
<text x="523" y="809" font-size="24" font-weight="700" fill="#ffffff" text-anchor="end">17,6</text>
<text x="40" y="850" font-size="24" fill="#6b6a63">Aufgaben in derselben Zeit; Prüfen kostete doppelt</text>

<rect x="44" y="880" width="18" height="18" fill="#17696b"/>
<text x="78" y="897" font-size="27" fill="#10233a">Prüfen kostet auch Zeit.</text>
<rect x="44" y="918" width="18" height="18" fill="#17696b"/>
<text x="78" y="935" font-size="27" fill="#10233a">Viel Zeit: du wirst sowieso fertig.</text>
<rect x="44" y="956" width="18" height="18" fill="#17696b"/>
<text x="78" y="973" font-size="27" fill="#10233a">Wenig Zeit: du kannst es dir nicht leisten.</text>
<rect x="44" y="994" width="18" height="18" fill="#b0521a"/>
<text x="78" y="1011" font-size="27" font-weight="700" fill="#10233a">Der Tipp zahlt sich also nie ganz aus.</text>

<text x="40" y="1058" font-size="24" fill="#6b6a63">Was wir weggelassen haben: das war eine</text>
<text x="40" y="1086" font-size="24" fill="#6b6a63">Computersimulation mit erfundenen Hausaufgaben.</text>
</g>
</svg>
