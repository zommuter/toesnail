<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="eli" viewBox="0 0 700 1970" role="img" aria-labelledby="p1t p1d">
<style>
.eli{display:block;width:100%;height:auto;max-width:700px;margin:0 auto;background:#fbfaf7;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eli text{fill:#26241d}
.eli .h1{font-size:48px;font-weight:800;fill:#14130f}
.eli .h2{font-size:33px;font-weight:700;fill:#14130f}
.eli .sub{font-size:27px;font-weight:600;fill:#3d3a31}
.eli .bd{font-size:26px}
.eli .bg{font-size:27px;font-weight:700;fill:#14130f}
.eli .lb{font-size:24px;font-weight:700}
.eli .sm{font-size:22px;fill:#6b6a63}
.eli .m{text-anchor:middle}
.eli .hot{fill:#d8542a}
.eli .cool{fill:#2a6fd6}
.eli .grey{fill:#8b877a}
.eli .green{fill:#2c6b4c}
.eli .panel{fill:#f2f0e8;stroke:#dcd8c9;stroke-width:2}
.eli .honest{fill:#eaf1ec;stroke:#4a8f6b;stroke-width:2}
.eli .rule{stroke:#c9c5b6;stroke-width:2}
.eli .kb{stroke:#2a6fd6;stroke-width:5;fill:none;stroke-linecap:round}
.eli .kr{stroke:#d8542a;stroke-width:5;fill:none;stroke-linecap:round}
.eli .ink{stroke:#26241d;stroke-width:4;fill:none;stroke-linecap:round}
</style>

<title id="p1t">Poster: wie man etwas mit einem Lichtstrahl einfriert</title>
<desc id="p1d">Ein Poster in vier Teilen. Teil eins: Temperatur ist Zappeln, abkühlen heisst also abbremsen, gezeichnet als heisses Atom mit grossen Zappelstrichen neben einem kalten Atom mit winzigen. Teil zwei: der Trick besteht darin, das Licht so abzustimmen, dass nur ein Atom, das dem Strahl entgegenfliegt, die richtige Farbe zum Schlucken sieht. Nur die ankommenden werden also getroffen, und jeder Treffer ist ein Schubs nach hinten. Ein wegfliegendes Atom sieht die falsche Farbe, der Strahl fliegt an ihm vorbei. Teil drei: das ist die Sirene des Krankenwagens, der Doppler-Effekt, gezeichnet als gestauchte Schallwellen vorn und gedehnte hinten. Teil vier, das Ehrliche: das Licht ist nicht kalt, die Atome geben ihre Bewegung an das Licht ab, das damit davonfliegt.</desc>

<rect x="0" y="0" width="700" height="1970" fill="#fbfaf7"/>

<text class="sm" x="44" y="52">POSTER 1 VON 2   .   LASERKÜHLUNG</text>
<text class="h1" x="44" y="124">Wie man etwas mit</text>
<text class="h1" x="44" y="178">Licht einfriert</text>
<text class="sub" x="44" y="222">Doch, wirklich. Licht bremst Dinge ab.</text>
<line class="rule" x1="44" y1="250" x2="656" y2="250"/>

<text class="h2" x="44" y="304">1. Kalt heisst: kaum Bewegung</text>
<text class="bd" x="44" y="348">Temperatur ist Zappeln. Heisse Dinge</text>
<text class="bd" x="44" y="380">zappeln stark, kalte kaum noch.</text>

<rect class="panel" x="44" y="404" width="296" height="160" rx="14"/>
<text class="lb m hot" text-anchor="middle" x="192" y="442">HEISS</text>
<circle class="cool" cx="192" cy="490" r="22"/>
<line class="kr" x1="162" y1="490" x2="126" y2="490"/>
<line class="kr" x1="166" y1="474" x2="134" y2="462"/>
<line class="kr" x1="166" y1="506" x2="134" y2="518"/>
<line class="kr" x1="222" y1="490" x2="258" y2="490"/>
<line class="kr" x1="218" y1="474" x2="250" y2="462"/>
<line class="kr" x1="218" y1="506" x2="250" y2="518"/>
<text class="sm m" text-anchor="middle" x="192" y="544">zappelt stark</text>

<rect class="panel" x="360" y="404" width="296" height="160" rx="14"/>
<text class="lb m cool" text-anchor="middle" x="508" y="442">KALT</text>
<circle class="cool" cx="508" cy="490" r="22"/>
<line class="kb" x1="480" y1="490" x2="466" y2="490"/>
<line class="kb" x1="536" y1="490" x2="550" y2="490"/>
<text class="sm m" text-anchor="middle" x="508" y="544">kaum in Bewegung</text>

<text class="bg" x="44" y="612">Abkühlen heisst also: abbremsen.</text>

<text class="h2" x="44" y="674">2. Nur die treffen, die ankommen</text>
<text class="bd" x="44" y="718">Stimme das Licht so ab, dass ein Atom, das</text>
<text class="bd" x="44" y="750">dem Strahl ENTGEGENFLIEGT, genau die</text>
<text class="bd" x="44" y="782">richtige Farbe zum Schlucken sieht.</text>
<text class="bd" x="44" y="814">Wer wegfliegt, sieht die falsche Farbe.</text>

<rect class="panel" x="44" y="838" width="612" height="190" rx="14"/>
<text class="sm m" text-anchor="middle" x="170" y="876">Atom fliegt heran</text>
<circle class="cool" cx="170" cy="928" r="26"/>
<line class="kb" x1="200" y1="928" x2="268" y2="928"/>
<path class="cool" d="M 268,916 L 296,928 L 268,940 Z"/>
<text class="lb m hot" text-anchor="middle" x="306" y="884">TREFFER</text>
<rect x="336" y="904" width="300" height="48" rx="6" fill="#f9e2d6" stroke="#d8542a" stroke-width="2"/>
<path class="hot" d="M 352,928 L 378,914 L 378,942 Z"/>
<path class="hot" d="M 422,928 L 448,914 L 448,942 Z"/>
<path class="hot" d="M 492,928 L 518,914 L 518,942 Z"/>
<path class="hot" d="M 562,928 L 588,914 L 588,942 Z"/>
<text class="sm m" text-anchor="middle" x="486" y="978">der Laserstrahl, hierhin gezielt</text>
<line class="kr" x1="206" y1="992" x2="126" y2="992"/>
<path class="hot" d="M 126,980 L 98,992 L 126,1004 Z"/>
<text class="sm" x="220" y="1000">ein winziger Schubs nach hinten</text>

<rect class="panel" x="44" y="1046" width="612" height="160" rx="14"/>
<text class="sm m" text-anchor="middle" x="200" y="1082">Atom fliegt weg</text>
<circle class="cool" cx="200" cy="1134" r="26"/>
<line class="kb" x1="168" y1="1134" x2="100" y2="1134"/>
<path class="cool" d="M 100,1122 L 72,1134 L 100,1146 Z"/>
<text class="lb m grey" text-anchor="middle" x="284" y="1140">VORBEI</text>
<rect x="336" y="1110" width="300" height="48" rx="6" fill="#efece4" stroke="#b3afa2" stroke-width="2" stroke-dasharray="8 5"/>
<path class="grey" d="M 352,1134 L 378,1120 L 378,1148 Z"/>
<path class="grey" d="M 422,1134 L 448,1120 L 448,1148 Z"/>
<path class="grey" d="M 492,1134 L 518,1120 L 518,1148 Z"/>
<path class="grey" d="M 562,1134 L 588,1120 L 588,1148 Z"/>
<text class="sm m" text-anchor="middle" x="486" y="1184">falsche Farbe, es fliegt vorbei</text>

<text class="bg" x="44" y="1256">Tausende Schubser später: fast gestoppt.</text>

<text class="h2" x="44" y="1318">3. Diesen Trick kennst du schon</text>
<text class="bd" x="44" y="1362">Eine Sirene klingt höher, wenn der</text>
<text class="bd" x="44" y="1394">Krankenwagen auf dich zurast, und tiefer,</text>
<text class="bd" x="44" y="1426">wenn er vorbei ist. Fliegst du auf ein Licht</text>
<text class="bd" x="44" y="1458">zu, passiert dasselbe mit seiner Farbe.</text>
<text class="bd" x="44" y="1490">Das ist der Doppler-Effekt.</text>

<rect class="panel" x="44" y="1514" width="612" height="152" rx="14"/>
<line class="ink" x1="382" y1="1536" x2="302" y2="1536"/>
<path fill="#26241d" d="M 302,1528 L 280,1536 L 302,1544 Z"/>
<text class="sm" x="392" y="1542">fährt hierhin</text>
<rect x="298" y="1564" width="124" height="48" rx="8" fill="#f2f0e8" stroke="#26241d" stroke-width="3"/>
<rect x="344" y="1552" width="26" height="12" rx="3" fill="#d8542a"/>
<circle fill="#26241d" cx="326" cy="1618" r="11"/>
<circle fill="#26241d" cx="396" cy="1618" r="11"/>
<path class="kr" d="M 272,1557 A 34,34 0 0 0 272,1621"/>
<path class="kr" d="M 254,1557 A 34,34 0 0 0 254,1621"/>
<path class="kr" d="M 236,1557 A 34,34 0 0 0 236,1621"/>
<path class="kb" d="M 448,1557 A 34,34 0 0 1 448,1621"/>
<path class="kb" d="M 478,1557 A 34,34 0 0 1 478,1621"/>
<path class="kb" d="M 508,1557 A 34,34 0 0 1 508,1621"/>
<text class="sm m" text-anchor="middle" x="222" y="1654">gestaucht, höher</text>
<text class="sm m" text-anchor="middle" x="478" y="1654">gedehnt, tiefer</text>

<rect class="honest" x="44" y="1694" width="612" height="160" rx="14"/>
<text class="lb green" x="72" y="1738">Das ehrliche Kleingedruckte</text>
<text class="bd" x="72" y="1778">Das Licht ist nicht kalt. Die Atome</text>
<text class="bd" x="72" y="1810">geben ihre Bewegung an das Licht ab,</text>
<text class="bd" x="72" y="1842">das damit davonfliegt. Nichts ist gratis.</text>

<text class="sm" x="44" y="1890">Was wir weggelassen haben: echte Fallen brauchen</text>
<text class="sm" x="44" y="1916">Strahlen aus allen Richtungen, das Abstimmen ist heikel,</text>
<text class="sm" x="44" y="1942">und es gibt eine kälteste Temperatur, die dieser Trick</text>
<text class="sm" x="44" y="1968">nicht unterbietet.</text>
</svg>
