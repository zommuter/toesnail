[project]
name = "resogram"
version = "0.1.0"
description = "Resonator-bank time-frequency display (resogram) with STFT and CWT baselines"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
plot = ["matplotlib>=3.7"]
live = ["sounddevice>=0.4", "matplotlib>=3.7"]

[project.scripts]
resogram = "resogram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resogram"]
